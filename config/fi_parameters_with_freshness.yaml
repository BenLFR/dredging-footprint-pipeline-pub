scenarios:
  default:
    k_fast:
      "North Pacific": 1.67
      "South Pacific": 3.84
      Atlantic: 1.00
      Indian: 4.76
      Mediterranean: 12.3
      Arctic: 0.275
      "Gulf of Mexico and Caribbean": 16.8
    k_fast_multiplier: 1.0
    alpha_dep: 0.25
    fast_fraction: 0.30
    slow_k: 0.05
    # Depth weights. "mechanistic": alpha and w
    # per pool, derived from D_b (mixing) and omega (burial); alpha_dep is then
    # NOT used. "fixed": former calculation (alpha_dep over 5-10 cm, nothing below 10 cm).
    depth_mode: mechanistic
    Db_cm2_yr: 24.3    # Middelburg et al. 1996 GBC 10:661 table 1: D_b = 4.4 x 10^(0.7624 - 0.000397 z), z = 50 m
    omega_cm_yr: 0.42  # same source: omega = 3.3 x 10^(-0.8748 - 0.000435 z) cm/yr, z = 50 m
    preservation_factor: 0.87   # p_r: fraction that resettles in originating cell (Sala et al. 2021)
    depletion_factor: 0.272     # d_i: OC stock depletion after >10 years chronic trawling (Atwood et al. 2024)
    # fresh_fact: NOT in the central estimate (explicit decision): no source gives x1.5 / x0.5,
    # and the direction of the x0.5 is called into question by
    # Arndt et al. 2013 (sect. 6.3) and Xu et al. 2023. Without fresh_fact, the merge
    # sets fresh_fact = 1.0 everywhere. The table is kept as is in the scenario
    # freshness_provinces, at the bottom of the file.
  conservative:
    inherit: default
    k_fast_multiplier: 0.5
    slow_k: 0.025
  upper_bound:
    inherit: default
    depth_mode: fixed   # slow_k = 0 makes the mechanistic mode undefined
    alpha_dep: 1.0
    fast_fraction: 1.0
    slow_k: 0.0
    k_fast_multiplier: 1.0
  # --- depth-profile scenarios ---
  fixed_ref:          # reproduces the former calculation (fixed depth weights)
    inherit: default
    depth_mode: fixed
  omega_0p1:          # sensitivity to the burial rate (Assessment)
    inherit: default
    omega_cm_yr: 0.1
  omega_1:
    inherit: default
    omega_cm_yr: 1.0
  omega_5:            # order of magnitude of a silted port or channel
    inherit: default
    omega_cm_yr: 5.0
  # --- former freshness correction, as a scenario ---
  # Per-province comments NOT corrected: several are wrong (PSAE/PSAW, NWCS, AUSW);
  # codes SPTE, NPSG, SPTG, SPPF, SPEQ do not exist in Longhurst (inert).
  freshness_provinces:
    inherit: default
    # Province-scale freshness correction applied to p_l_eff before kinetics.
    # ×1.5 = high-export provinces (upwelling, high primary productivity, reactive OC flux)
    # ×0.5 = cold sub-polar or isolated/hypoxic provinces (slow degradation / preservation)
    # ×1.0 = default (oligotrophic gyres, transitional provinces)
    # Source: Longhurst v4 2010 ProvCode (Longhurst_world_v4_2010.shp, field ProvCode)
    fresh_fact:
      # ── High-export provinces (×1.5) ─────────────────────────────────────────
      ARAB: 1.5   # Arabian Sea — monsoon-driven upwelling, high PP (confirmed literature)
      PSAE: 1.5   # Pacific S. America East — Peru-Chile upwelling (same system as CHIL)
      PSAW: 1.5   # Pacific S. America West — Peru-Chile upwelling (same system as CHIL)
      CHIL: 1.5   # Chile-Peru Current — eastern boundary upwelling
      BENG: 1.5   # Benguela Current — eastern boundary upwelling
      CCAL: 1.5   # California Current — eastern boundary upwelling
      PEQD: 1.5   # Pacific Equatorial Divergence — equatorial upwelling
      KURO: 1.5   # Kuroshio Current — productive warm western boundary current
      CHIN: 1.5   # China Sea Coastal — high riverine input (Yangtze), coastal productive
      GUIN: 1.5   # Guinea Current — coastal upwelling
      NECS: 1.5   # NE Atlantic Coastal — temperate coastal, high productivity
      NWCS: 1.5   # NW African Coastal — Canary upwelling system
      ETRA: 1.5   # Eastern Tropical Atlantic — equatorial upwelling influence
      WTRA: 1.5   # Western Tropical Atlantic — moderate to high productivity
      INDE: 1.5   # Indian Ocean — productive Indian province
      INDW: 1.5   # Indian West — western Indian coastal, upwelling-influenced
      SUND: 1.5   # Sunda-Arafura Shelves — productive coastal shelf
      MONS: 1.5   # Monsoon Gyres — strong seasonal productivity pulse
      NATR: 1.5   # North Atlantic Tropical — moderate-high export flux
      AUSE: 1.5   # Australia East — productive boundary current province
      AUSW: 1.5   # Australia West — coastal upwelling influence
      NEWZ: 1.5   # New Zealand Coastal — productive coastal province
      CARB: 1.5   # Caribbean Sea — coastal productive
      # ── Cold sub-polar or hypoxic/isolated provinces (×0.5) ──────────────────
      ARCT: 0.5   # Arctic Province — polar, cold
      SARC: 0.5   # Subarctic Atlantic — cold sub-polar
      BPLR: 0.5   # Bering Sea Polar — polar
      NPPF: 0.5   # N. Pacific Polar Front — cold sub-polar
      ALSK: 0.5   # Alaska Coastal — cold
      BERS: 0.5   # Bering Sea — cold polar
      ANTA: 0.5   # Antarctic Province — polar
      APLR: 0.5   # Austral Polar — polar
      SANT: 0.5   # Subantarctic Water Ring — cold
      SSTC: 0.5   # S. Subtropical Convergence — cold subpolar
      SPTE: 0.5   # S. Pacific Transition Zone — cold sub-polar transition
      FKLD: 0.5   # Falkland/Malvinas Current — cold subpolar boundary current
      REDS: 0.5   # Red Sea — isolated, low export, highly stratified
      # ── Default / oligotrophic provinces (×1.0) ──────────────────────────────
      NASW: 1.0   # N. Atlantic Subtropical Gyre West — oligotrophic gyre
      NASE: 1.0   # N. Atlantic Subtropical Gyre East — oligotrophic gyre
      NADR: 1.0   # N. Atlantic Drift — temperate, moderate
      GFST: 1.0   # Gulf Stream — transitional
      CNRY: 1.0   # Canary Current — moderate
      MEDI: 1.0   # Mediterranean Sea — moderate
      NPSG: 1.0   # N. Pacific Subtropical Gyre — oligotrophic
      NPTG: 1.0   # N. Pacific Tropical Gyre — oligotrophic
      NPSW: 1.0   # N. Pacific Subtropical Gyre West — oligotrophic
      SPSG: 1.0   # S. Pacific Subtropical Gyre — oligotrophic
      SPTG: 1.0   # S. Pacific Tropical Gyre — oligotrophic
      SPPF: 1.0   # S. Pacific Polar Front — transitional
      SPEQ: 1.0   # S. Pacific Equatorial Countercurrent — moderate
      PNEC: 1.0   # Pacific N. Equatorial Current — oligotrophic
      ISSG: 1.0   # Indian S. Subtropical Gyre — oligotrophic gyre
      SATL: 1.0   # S. Atlantic Gyral Province — oligotrophic gyre
      WARM: 1.0   # W. Pacific Warm Pool — oligotrophic, nutrient-poor
      BRAZ: 1.0   # Brazil Current — low productivity oligotrophic WBC
      TASM: 1.0   # Tasman Sea — temperate, moderate
      ARCH: 1.0   # Archipelagic Deep Basins — oligotrophic deep basins
      CAMR: 1.0   # Central American Coastal — moderate productivity
      EAFR: 1.0   # Eastern Africa Coastal — moderate
      GUIA: 1.0   # Guyana Current — moderate
