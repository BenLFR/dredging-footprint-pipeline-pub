# ship_specs.yaml
# Technical specifications for the 10 TSHDs used in the pipeline
# Note: Goryo 6 Ho excluded (corrupted data)
# Units:
#   - service_speed_kn        : knots
#   - suction_pipe_diameter_mm: millimetres (one pipe; the number of pipes is n_suction_pipes)
#   - dredge_width_m          : suction pipe diameter in metres (suction_pipe_diameter_mm / 1000); the draghead width is derived from it in constants.R
#   - dredging_depth_m        : maximum dredging depth (m)
#   - hopper_capacity_m3      : cubic metres
#   - installed_power_kw      : kilowatts
#   - length_m                : metres
#   - draught_m               : metres

