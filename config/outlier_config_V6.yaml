# ===============================================================================
# V6 OUTLIER DETECTION SYSTEM CONFIGURATION
# Parameter file for operational tuning without changing the R code
# ===============================================================================

# Adaptive technical thresholds per vessel
technique:
  speed_margin_pct: 0.15          # 15% margin on sailing_speed_knots
  default_max_speed: 25           # Default max speed if specs are missing (kn)
  missing_specs_threshold: 0.10   # Alert threshold if >10% of specs are missing

# Multivariate Isolation Forest
isolation_forest:
  contamination_rate: 0.03        # 3% rather than 5%, to save memory
  sample_size: 512                # 512 rather than 1000, to save memory
  num_trees: 50                   # 50 trees rather than 100
  min_points_per_vessel: 100      # Minimum number of points to apply IF per vessel
  max_depth: 8                    # Depth limit to save memory

# Detection of isolated temporal spikes
temporal_spikes:
  spike_factor: 5.0                # 5x MAD for temporal spike detection (thesis §2.2)
  min_duration: 2                 # Minimum neighbourhood duration to avoid false positives
  rolling_window: 5               # Rolling window size for median/MAD

# Robust contextual percentiles
contextual:
  percentile_lower: 0.01           # 1st percentile for extreme low values
  percentile_upper: 0.99           # 99th percentile for extreme high values
  min_context_points: 20          # Min points for stable percentiles → IQR fallback
  
  # Operational context classification thresholds (kn)
  context_thresholds:
    stop_threshold: 1.0           # Speed < 1kn = stopped/anchored
    dredging_threshold: 4.0       # Speed < 4kn = dredging operation
    maneuver_threshold: 8.0       # Speed < 8kn = slow manoeuvre
    # Speed >= 8kn = fast transit

# Physical plausibility checks
physics:
  max_acceleration_ms2: 2.0       # Realistic max acceleration for large vessels (m/s²)
  max_turn_at_speed: 120          # Max turn angle if Speed > 5kn (degrees)
  max_dredging_speed: 6.0         # Max speed consistent with dredging (kn)
  min_speed_for_turn_check: 5.0   # Min speed for checking sharp turns (kn)

# Performance and optimisation
performance:
  parallel_threshold: 1000000     # Number of points to enable parallelism
  memory_cleanup: true            # Purge IF objects after use
  enable_logging: true            # Save outliers for audit
  verbose_diagnostics: true       # Detailed display of the cleaning

# Advanced parameters (experts only)
advanced:
  # Adaptive contamination for small samples
  adaptive_contamination: true
  min_sample_size: 500          # Min size for normal contamination
  
  # IQR fallback for contexts with few data
  iqr_fallback:
    multiplier: 1.5               # Standard IQR multiplier
    enabled: true
    
  # Physical conversion
  ms2_to_knots_factor: 1.943844   # Conversion factor m/s² → kn/s

# Validation and audit
audit:
  save_removed_outliers: true     # Save removed outliers (detailed CSV)
  consolidate_logs: true          # Create consolidated audit file
  save_config_copy: true          # Save the configuration used, for traceability
  summary_statistics: true        # Generate cleaning statistics summary
  write_outlier_csv: true         # I/O flag: false on large jobs (>100M rows)

# ===============================================================================
# NOTES FOR OPERATIONAL USERS:
#
# 1. TECHNICAL: adjust speed_margin_pct if fast vessels lose too much
#    legitimate data (increase) or if too many outliers pass (decrease)
#
# 2. ISOLATION FOREST: higher contamination_rate = more permissive
#    Recommended values: 0.03-0.07 depending on sensor quality
#
# 3. TEMPORAL SPIKES: lower spike_factor = stricter (2-4 recommended)
#    Decrease if too many sensor errors pass, increase if manoeuvres are lost
#
# 4. CONTEXTUAL: very wide percentiles by default (0.1%-99.9%)
#    Tighten towards 1%-99% if needed to be stricter
#
# 5. PHYSICAL: max_turn_at_speed depends on vessel type
#    Standard TSHD: 120°, more agile vessels: up to 140°
# ===============================================================================

# ==============================================================================
# OPTIMISED V6 OUTLIER CONFIGURATION - BELUGA HPC
# ==============================================================================

# Missing data handling
missing_specs_threshold: 0.5     # 50% minimum of technical specifications
min_segment_size: 50            # Minimum segment size for analysis

# Parallelisation parameters (MEMORY-OPTIMISED)
parallel_chunk_size: 5000       # Smaller chunks to save memory
max_parallel_vessels: 4         # Maximum 4 vessels in parallel
gc_frequency: 100               # Garbage collection every 100 segments

# Advanced configuration
robust_outlier_detection: true   # Robust methods for small samples
memory_conservative: true        # Memory-conservative mode enabled 

