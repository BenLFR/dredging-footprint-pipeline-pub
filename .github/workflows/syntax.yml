name: Source integrity and syntax
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
      - name: Test the manifest checker
        run: python -m unittest discover -s tests -v
      - name: Verify source bytes and parse syntax
        run: python scripts/check_source.py --syntax
      - name: Verify the archive inventory
        run: python scripts/make_archive_manifest.py --check
